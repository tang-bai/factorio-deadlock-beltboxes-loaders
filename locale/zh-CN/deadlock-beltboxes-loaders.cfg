[entity-description]
deadlock-loader=在传送带和库存之间快速转移资源。放置后旋转以更改输入/输出模式。
deadlock-beltbox=堆叠压缩/平分解压一些资源和产品，以实现5倍压缩率，便于传送带上运输。
deadlock-stack-loader=在传送带和库存之间成批搬运整堆物品，并像堆叠机械臂那样把整堆物品分层放到传送带上。放置后旋转以更改输入/输出模式。

