[mod-setting-description]
deadlock-stacking-auto-unstack=自动将从地面或传送带上拣起的任何堆放物品卸下。
deadlock-stacking-hide-unstacking=从“玩家制作”选项卡中删除平分解压配方。这可以防止您“手动平分解压”，但会消除很多混乱。
deadlock-loaders-snap-to-belts=装卸机将在放置时自动设置其模式和旋转以匹配相邻传送带（以及其传送带一侧的库存）。
deadlock-loaders-snap-to-inventories=装卸机将自动输入他们在放置时面对或远离的库存。
deadlock-stacking-batch-stacking=堆叠机将分4批堆叠压缩和平分解压，均匀装卸传送带，并通过超高速改装传送带增加吞吐量。
deadlock-stacking-show-alt-info=在alt模式下显示或隐藏显示在传送带箱上的配方图标。
deadlock-strict-fast-replace-beltboxes=防止堆叠机快速更换除其他堆叠机以外的任何东西。
deadlock-strict-fast-replace-loaders=防止装卸机快速更换除其他装卸机以外的任何东西。
deadlock-enable-stack-loaders=为每一档装卸机生成堆叠版本：速度与本档装卸机相同，但一次搬运一整堆物品，并能把物品分层堆放到传送带上。需要太空时代的「堆叠机械臂」科技，没装太空时代时不生成。
deadlock-stack-loader-stack-size=堆叠装卸机一次搬运的物品数量，也是它往传送带上堆放的最大层数。4 与太空时代的堆叠机械臂一致。警告：不建议在已有存档中更改此项。
deadlock-stack-size=设置组成每个堆叠项目的项目数。 警告：不建议为现有的已保存游戏更改此设置。 如果将堆叠的项目配置为一定数量，则它们的堆叠大小不会被均分。
deadlock-enable-beltboxes=是否生成各档堆叠机（机器、配方与科技）。关掉就不生成堆叠机；堆叠物品与 5 倍压缩配方由下面「生成堆叠物品」单独控制。改变后需要重新开始游戏才会生效。
deadlock-enable-stacks=是否生成堆叠物品、堆叠/拆堆配方与堆叠科技。关掉就没有 5 倍压缩体系；只关堆叠机、保留这一项时压缩物品仍然存在（此时只能手动拆堆）。改变后需要重新开始游戏才会生效。
deadlock-enable-loaders=是否生成装卸机。改变后需要重新开始游戏才会生效。

[mod-name]
deadlock-beltboxes-loaders-CN=僵局之堆叠机和装卸机

[mod-description]
deadlock-beltboxes-loaders-CN=添加1x1装卸机和堆叠机，使一些资源和产品，以实现5倍压缩率，便于传送带上运输。本模组是 deadlock-beltboxes-loaders 的中文分支（内部名称 deadlock-beltboxes-loaders-CN）：内置 Bob's Logistics 的传送带等级支持（基础/Turbo/终极，与该模组的传送带同速），每一级升级只需「上一级装卸机 + 铁板 ×2 + 铁齿轮 ×2」，并自带完整简体中文。
