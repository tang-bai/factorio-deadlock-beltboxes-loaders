[mod-setting-description]
deadlock-enable-beltboxes=Whether the stacking beltbox machines of each tier (machine, recipe and technology) are generated. Turn this off to play without them; the stacked items and the 5x compression recipes are controlled separately by "Generate stacked items" below. Needs a new game to take effect.
deadlock-enable-stacks=Whether the stacked items, the stacking/unstacking recipes and the stacking technologies are generated. With beltboxes switched off this keeps the 5x compression items (they can then only be unstacked by hand). With beltboxes switched on but this off, the beltboxes are generated without any stacking recipes. Needs a new game to take effect.
deadlock-stacking-auto-unstack=Automatically unstack any stacked items picked up from the ground or belts.
deadlock-stacking-hide-unstacking=Removes unstacking recipes from the player crafting tab. This prevents you from "hand-unstacking" but removes a lot of clutter.
deadlock-loaders-snap-to-belts=Loaders will automatically set their mode and rotation to match adjacent belts (and inventories on their belt side) when placed
deadlock-loaders-snap-to-inventories=Loaders will automatically input into inventories they're facing toward or away from when placed
deadlock-stacking-batch-stacking=Beltboxes will stack and unstack in batches of 4, loading belts evenly and increasing throughput with extremely high speed modded belts
deadlock-stacking-show-alt-info=Shows or hides the recipe icon displayed on beltboxes in alt-mode.
deadlock-strict-fast-replace-beltboxes=Prevent beltboxes from fast replacing anything but other beltboxes
deadlock-strict-fast-replace-loaders=Prevent loaders from fast replacing anything but other loaders
deadlock-enable-stack-loaders=Adds a stacking version of every compact loader: same speed as the loader of its tier, but it moves a whole stack at once and puts layered stacks onto belts. Requires the Space Age stack inserter technology, and is not created without Space Age.
deadlock-stack-loader-stack-size=How many items a stack loader carries in one move, and how many layers it can stack onto a transport belt. 4 matches the stack inserter from Space Age. Warning: it is not recommended to change this setting for existing saved games.
deadlock-stack-size=Set the number of items making up each stacked item. Warning: it is not recommended to change this setting for existing saved games. Stacked items will lose inventory density when this is configured to a number their stack sizes don't divide evenly by.

[mod-description]
deadlock-beltboxes-loaders-CN=Adds minimalist 1x1 loaders and stacking beltboxes for 5x belt compression for ores, plates and some intermediate products. This is the CN branch of Deadlock's Stacking Beltboxes & Compact Loaders, published under its own mod name (deadlock-beltboxes-loaders-CN): it includes built-in support for Bob's Logistics belt tiers (basic, turbo and ultimate) at that mod's belt speeds, cheap one-tier-upgrade recipes, and a complete Simplified Chinese (zh-CN) translation.
