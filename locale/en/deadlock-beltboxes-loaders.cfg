deadlock-loader=Quickly transfers resources between belts and inventories. Rotate after placement to change input/output mode.
deadlock-beltbox=Stacks/unstacks some resources and products, enabling 5x compression on belts.
deadlock-stack-loader=Moves whole stacks of items between belts and inventories, and layers those stacks onto transport belts like a stack inserter. Rotate after placement to change input/output mode.

